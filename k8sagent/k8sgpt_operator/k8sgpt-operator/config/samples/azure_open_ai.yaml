apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-ollama
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    secret:
      name: k8sgpt-sample-secret
      key: azure-api-key
    model: gpt-4o-mini
    backend: azureopenai
    baseUrl: https://yogeshtestaiopen.openai.azure.com
    engine: llm
  analysis:
    interval: "1m"  # Set analysis interval to 5 minutes
  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.1
